[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "load-into-snowflake"
version = "0.1.0"
description = "Modular ELT pipeline for BTS data"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "requests",
    "snowflake-connector-python",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["load_into_snowflake/src"]
include = ["load_into_snowflake*"]

[tool.pytest.ini_options]
pythonpath = ["load_into_snowflake/src"]
testpaths = ["load_into_snowflake/tests"]